- include_vars: controls.yml

- name: Check forbidden packages
  shell: dpkg -l | grep "^ii" | grep "{{ item }}"
  loop: "{{ db_controls.forbidden_packages }}"
  register: pkg_check
  failed_when: false
  changed_when: false

- name: Check DB services
  shell: systemctl is-active {{ item }}
  loop: "{{ db_controls.db_services }}"
  register: db_services
  failed_when: false
  changed_when: false

- name: Check forbidden services
  shell: systemctl is-enabled {{ item }}
  loop: "{{ db_controls.forbidden_services }}"
  register: svc_check
  failed_when: false
  changed_when: false

- name: Check open ports
  shell: ss -tuln
  register: ports
  changed_when: false

- name: Audit summary
  debug:
    msg:
      - "DB AUDIT REPORT"
      - "----------------"
      - "Unsafe packages: {{ pkg_check.results | selectattr('rc','equalto',0) | list | length }}"
      - "DB services checked"
      - "Forbidden services checked"
      - "Ports scanned"