baseline_controls:

  remove_unsafe_packages:
    - telnet
    - rsh-client
    - rexec

  file_permissions:
    - path: /etc/passwd
      mode: "0644"
    - path: /etc/shadow
      mode: "0000"

  required_services:
    - rsyslog
    - systemd-timesyncd

  kernel_security:
    sysctl:
      net.ipv4.ip_forward: 0
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.all.send_redirects: 0