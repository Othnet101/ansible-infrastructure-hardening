- include_vars: controls.yml

- name: Check installed forbidden packages
  shell: dpkg -l | grep "^ii" | grep "{{ item }}"
  loop: "{{ web_controls.forbidden_packages }}"
  register: pkg_audit
  failed_when: false
  changed_when: false

- name: Check required service status
  service_facts:

- name: Check Apache modules
  shell: apache2ctl -M | grep "{{ item }}"
  loop: "{{ web_controls.forbidden_modules }}"
  register: module_audit
  failed_when: false
  changed_when: false

- name: Extract listening ports
  shell: ss -tuln | awk 'NR>1 {print $5}' | sed 's/.*://g' | sort -u
  register: ports
  changed_when: false

- name: Check web root permissions
  stat:
    path: "{{ item }}"
  loop: "{{ web_controls.sensitive_paths }}"
  register: perms

- name: Web audit summary
  debug:
    msg:
      - "[WEB] Ports : {{ ports.stdout_lines | join(' ') }}"
      - "[WEB] Apache : {{ 'RUNNING' if ansible_facts.services['apache2.service'].state == 'running' else 'STOPPED' }}"
      - "[WEB] Autoindex : {{ 'ENABLED' if module_audit.results[0].rc == 0 else 'DISABLED' }}"
      - "[WEB] Unsafe PKG : {{ 'FOUND' if pkg_audit.results | selectattr('rc','equalto',0) | list | length > 0 else 'CLEAN' }}"